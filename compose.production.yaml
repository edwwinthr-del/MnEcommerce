# Use with: docker compose -f compose.yaml -f compose.production.yaml ...
# APP_URL/NEXT_PUBLIC_SITE_URL must be the same https:// origin.
x-production-env: &production-env
  APP_ENV: production
  APP_DEBUG: 'false'
  APP_URL: ${APP_URL:?Set the public HTTPS origin}
  FRONTEND_URL: ${NEXT_PUBLIC_SITE_URL:?Set the public HTTPS origin}
  SESSION_SECURE_COOKIE: 'true'
  SANCTUM_STATEFUL_DOMAINS: ${SANCTUM_STATEFUL_DOMAINS:?Set the public hostname}
  MAIL_MAILER: smtp

services:
  backend:
    environment: *production-env
  queue:
    environment: *production-env
  scheduler:
    environment: *production-env
  nginx:
    ports:
      - '443:443'
    volumes:
      - ./docker/nginx.tls.conf:/etc/nginx/conf.d/default.conf:ro
      - ${TLS_CERT_DIRECTORY:?Directory containing fullchain.pem and privkey.pem}:/etc/nginx/tls:ro
