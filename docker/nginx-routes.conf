root /var/www/html/public;
server_tokens off;
client_max_body_size 10m;

add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header X-Frame-Options DENY always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

# Only raster images are served from public uploads.
location ~* ^/storage/(.+\.(?:jpg|jpeg|png|webp|gif|avif))$ {
    alias /var/www/html/storage/app/public/$1;
    expires 7d;
}
location /storage/ { return 404; }

location ~ ^/(css|js|fonts)/ {
    try_files $uri =404;
    expires 7d;
}

location ~ ^/(api|admin|livewire(?:-[a-zA-Z0-9]+)?|sanctum)(/|$) {
    try_files /__no_static_route__ @laravel;
}
location = /up { try_files /__no_static_route__ @laravel; }

location @laravel {
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
    fastcgi_param SCRIPT_NAME /index.php;
    fastcgi_param HTTP_PROXY "";
    fastcgi_param HTTPS $https if_not_empty;
    fastcgi_param HTTP_X_FORWARDED_PROTO $scheme;
    fastcgi_pass backend:9000;
    fastcgi_read_timeout 60s;
}

location ~ /\. { deny all; }
location ~ \.php$ { return 404; }

location / {
    proxy_pass http://frontend:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 60s;
}
